global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: inkvia

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: inkvia-web
    metrics_path: /api/internal/admin-metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/internal_metrics_token
    static_configs:
      - targets:
          - host.docker.internal:3100
        labels:
          service: web

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          service: postgresql

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: server

  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090
        labels:
          service: prometheus

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100
        labels:
          service: loki

  - job_name: tempo
    static_configs:
      - targets:
          - tempo:3200
        labels:
          service: tempo

  - job_name: alloy
    static_configs:
      - targets:
          - alloy:12345
        labels:
          service: alloy

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
        labels:
          service: alertmanager
